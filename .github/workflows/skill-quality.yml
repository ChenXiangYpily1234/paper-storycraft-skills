name: Skill documentation validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_skills.py
      - name: Validate bilingual README GIFs
        run: |
          python -m pip install 'Pillow>=10,<12'
          python - <<'PY'
          from PIL import Image
          for lang in ('zh', 'en'):
              for topic in ('argument', 'citation'):
                  path = f'assets/demo-{topic}-{lang}.gif'
                  with Image.open(path) as im:
                      assert im.n_frames >= 3, f'Expected animated GIF: {path}'
                      for i in range(im.n_frames):
                          im.seek(i)
                          im.load()
          print('PASS: all four bilingual README GIFs decode across all frames')
          PY
      - run: python scripts/export_skills.py --output "${{ runner.temp }}/storycraft-skills-test"
