name: Render README demos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_readme_demos.py'
      - '.github/workflows/render-readme-demos.yml'
      - 'requirements-dev.txt'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fontconfig
          python -m pip install -r requirements-dev.txt
      - name: Generate animated and static examples
        run: python scripts/render_readme_demos.py
      # GITHUB_TOKEN pushes do not trigger a second push-based quality workflow.
      - name: Validate the generated files before committing
        run: python scripts/check_skills.py
      - name: Commit generated examples if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'assets/demo-*.gif' 'assets/demo-*.png'
          if git diff --cached --quiet; then
            echo "Examples already match source script"
          else
            git commit -m "docs: render lightweight animated README examples"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
